name: GA4 — Sync a Supabase
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
jobs:
  run-ga4-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pipeline_redes/requirements.txt
      - name: Install dependencies
        run: pip install -r pipeline_redes/requirements.txt
      - name: Run GA4 sync
        env:
          SUPABASE_URL: https://wuwhcljeigskajjoyghv.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY_CESAR }}
          GA4_SERVICE_ACCOUNT_B64: ${{ secrets.GA4_SERVICE_ACCOUNT_B64 }}
        run: |
          cd pipeline_redes
          python ga4_sync.py
