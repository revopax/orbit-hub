name: Brújula Comercial — Pipeline

on:
  schedule:
    - cron: '0 9 1 * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Create data dir
        run: mkdir -p data

      - name: Cache DENUE parquet
        id: cache-denue
        uses: actions/cache@v4
        with:
          path: data/denue_nacional.parquet
          key: denue-nacional-2024-v1

      - name: Run pipeline
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          DENUE_CACHED: ${{ steps.cache-denue.outputs.cache-hit }}
        run: |
          cd pipeline
          python run_pipeline.py

      - name: Save DENUE to cache
        uses: actions/cache/save@v4
        if: steps.cache-denue.outputs.cache-hit != 'true'
        with:
          path: data/denue_nacional.parquet
          key: denue-nacional-2024-v1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-output
          path: data/*.parquet
          retention-days: 30